services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dqp
      POSTGRES_PASSWORD: dqp_local_dev
      POSTGRES_DB: dqp
    ports:
      - "5432:5432"
    volumes:
      - dqp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dqp:dqp_local_dev@db:5432/dqp
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  dqp_pgdata:
